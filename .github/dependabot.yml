version: 2
updates:
  # 全量分组：每周外部+内部依赖合并为一个 PR，
  # 组合兼容性由该 PR 的 CI 一次验证，避免逐包 PR 洪峰（34+ PR 那种）。
  # 嵌套多模块仓：根模块 + 每个嵌套模块各一个 directory 条目。
  #
  # **嵌套模块必须单独登记**（2026-10-28 实测）：登记只有根模块时，
  # dependabot 只扫根模块的 go.mod ⇒ 嵌套模块的依赖**永远不会被提议升级**。
  # 本仓的嵌套模块 redis/ 就是这样被落下的：go-redis 停在 v9.22.0，
  # 而全矩阵其它地方（redisx / data / hertz / tracing）都已是 v9.23.0。
  # 落下的原因不是「升级失败」，而是「压根没被扫到」——没有任何报错会提示这件事。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /redis
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - "*"
